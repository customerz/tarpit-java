name: Custom Build
run-name: Custom Build - ${{ github.event.client_payload.event_type }}

# SDEVX-8201 test of a customer-style custom build (use_custom_workflow): build here,
# upload the artifact, then register the build so Veracode scans it.
on:
  repository_dispatch:
    types: [custom-build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.client_payload.sha }}

      - name: Build the application
        run: mvn -B -ntp package -DskipTests

      - name: Upload the artifact
        uses: actions/upload-artifact@v7
        with:
          name: tarpit-java-war
          path: target/tarpit-java.war

      - name: Register build
        id: register-build
        uses: veracode/github-actions-integration-helper@v0.1.12
        with:
          action: registerBuild
          token: ${{ github.event.client_payload.token }}
          appname: ${{ github.event.client_payload.user_config.profile_name }}
          source_repository: ${{ github.event.client_payload.repository.full_name }}
          check_run_id: ${{ github.run_id }}
          check_run_name: ${{ github.workflow }}
          head_sha: ${{ github.event.client_payload.sha }}
          event_type: ${{ github.event.client_payload.event_type }}
          branch: ${{ github.event.client_payload.repository.branch }}
          issue_trigger_flow: ${{ github.event.client_payload.user_config.issue_trigger_flow }}
